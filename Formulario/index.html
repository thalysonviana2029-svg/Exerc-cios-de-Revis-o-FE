        <br><br>

         <label for="n4">Numero 4: </label>

        <br><br>

         <label for="n5">Numero 5: </label>
        <input type="number" id="n5" min="1">

        <br><br>

        <button type="button" onclick="mostrarNumero()">Enviar</button>
        </form>
 
        <hr>

        <h2>Os números digitados são:</h2>

        <p id="number"></p>
    </center>
    <script src="script.js"></script>
