<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Caixa</title>
</head>
<body>
    <center>
        <h1>Sistema de Caixa</h1>
        <form type="formulario">
            <label for="cliente">Cliente: </label>
            <input type="text">
            
            <br><br>
            <label for="produto">Produto: </label>
            <input type="text" placeholder="Ex: Arroz">

            <br><br>
            <label for="preco">Preço: </label>
            <input type="number" id="preco" placeholder="Ex: 24.50">

            <br><br>
            <label for="quantidade">Quantidade: </label>
            <input type="number" id="quantidade" value="1" min="1">

            <br><br>
            <label for="formadp">Forma de Pagamento: </label>
            <select id="lista" name="lista">
                <option>Pix</option>
                <option>Dinheiro</option>
                <option>Cartão</option>
            </select>

            <br><br>
            <button type="button" onclick="comprarPruduto()">Comprar</button>

        </form>

        <hr> 

           <h2>Informações de sua compra</h2>

         <ul id="listaProdutos"></ul>
    </center>
    <script src="script.js"></script>
</body>
</html>
